<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tajlandia">
<meta name="theme-color" content="#f2b233">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Tajlandia 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* kierunek: plakat podróżny – ilustrowana sceneria regionu na górze, „arkusz” z treścią wjeżdża na nią; akcent zmienia się z regionem */
  --bg:#f1efe9; --surface:#ffffff; --ink:#141a24; --muted:#636b78; --line:#e3e0d8;
  --acc:#f2b233; --accink:#9a6400; --tint-light:#fbf3e2; --tint:var(--tint-light);
  --river:#0e6b66; --bad:#c62f2a; --ok:#1f8f57;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:20px; color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c1018; --surface:#151b26; --ink:#eef1f6; --muted:#98a1b0; --line:#252d3b; --tint:color-mix(in srgb,var(--acc) 16%,#151b26); --river:#46c2b8; --bad:#ff7a73; --ok:#59d08f; color-scheme: dark; } }
:root[data-theme="dark"]{
  --bg:#0c1018; --surface:#151b26; --ink:#eef1f6; --muted:#98a1b0; --line:#252d3b; --tint:color-mix(in srgb,var(--acc) 16%,#151b26); --river:#46c2b8; --bad:#ff7a73; --ok:#59d08f; color-scheme: dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body)}
a{color:inherit}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08;letter-spacing:-.01em}
h2{font-size:.98rem;font-weight:700}
.muted{color:var(--muted)} .small{font-size:.84rem}
svg{flex:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}

/* górny pasek */
header.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none}
header.top>*{pointer-events:auto}
.brand{font-family:var(--display);font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;border-radius:99px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
#sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:700;padding:7px 11px;border-radius:99px;background:color-mix(in srgb,var(--surface) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);white-space:nowrap}
#sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
#sync[data-state="ok"]::before{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
#sync[data-state="warn"]::before{background:var(--acc)}

main{max-width:720px;margin:0 auto;padding:0 0 110px}
body:not(.hashero) main{padding-top:calc(60px + env(safe-area-inset-top))}
.center{text-align:center}
.hero.login{min-height:0}

/* HERO */
.hero{position:relative;min-height:360px;overflow:hidden;color:#fff;isolation:isolate;display:flex;flex-direction:column;justify-content:flex-end}
.hero.countdown{min-height:0}
.hero .scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,8,20,.16) 0%,rgba(6,8,20,0) 18%,rgba(10,14,30,.08) 32%,rgba(10,14,30,.55) 62%,rgba(10,14,30,.82) 100%)}
.hero-ov{position:relative;padding:calc(76px + env(safe-area-inset-top)) 20px 44px;display:flex;flex-direction:column;gap:10px}
.eyebrow{display:flex;align-items:center;gap:8px;text-shadow:0 1px 8px rgba(0,0,0,.5);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.95}
.eyebrow .dot{width:5px;height:5px;border-radius:50%;background:var(--acc)}
.hdate{display:flex;align-items:flex-end;gap:12px}
.hd{font-family:var(--display);font-weight:800;font-size:5.2rem;line-height:.78;letter-spacing:-.06em;color:#fff;text-shadow:0 4px 0 var(--acc),0 10px 30px rgba(0,0,0,.45)}
.hm{text-shadow:0 1px 8px rgba(0,0,0,.5);font-size:.82rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;line-height:1.25;padding-bottom:4px}
.hero h1{font-size:1.55rem;font-weight:700;max-width:22ch;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hmeta{display:flex;flex-wrap:wrap;gap:8px}
.glass{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;text-decoration:none;font-size:.84rem;font-weight:700}
.glass svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hprog{position:relative;height:6px;border-radius:9px;background:rgba(255,255,255,.22);margin-top:4px}
.hprog i{position:absolute;inset:0 auto 0 0;border-radius:9px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.hprog span{position:absolute;right:0;top:-22px;font-size:.74rem;font-weight:800}
.cd{display:flex;align-items:flex-end;gap:14px}
.cdn{font-family:var(--display);font-weight:800;font-size:7.4rem;line-height:.78;letter-spacing:-.07em;color:#fff;text-shadow:0 6px 0 var(--acc),0 12px 40px rgba(0,0,0,.45)}
.cdl{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.1;padding-bottom:6px}
.lead{margin:0;font-size:1rem;max-width:34ch;opacity:.95}

/* scena: animacja */
.scene .lay{transform-box:fill-box}
@media (prefers-reduced-motion: no-preference){
  .hero .scene .far{animation:rise 1.1s cubic-bezier(.2,.7,.2,1) both}
  .hero .scene .far2{animation:rise 1.25s cubic-bezier(.2,.7,.2,1) both}
  .hero .scene .mid{animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
  .hero .scene .fg{animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
  .scene .boat{animation:bob 4.5s ease-in-out infinite}
  .scene .shimmer{animation:drift 7s linear infinite alternate}
  .scene .mist{animation:drift 14s ease-in-out infinite alternate}
  .scene .clouds{animation:drift 18s ease-in-out infinite alternate}
  .scene .train{animation:drift 9s ease-in-out infinite alternate}
  .scene .sun{animation:pulse 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
  .scene .plane{animation:fly 16s linear infinite}
  .hero-ov>*{animation:up .8s .25s cubic-bezier(.2,.7,.2,1) both}
  .hero-ov>*:nth-child(2){animation-delay:.32s}.hero-ov>*:nth-child(3){animation-delay:.4s}.hero-ov>*:nth-child(4){animation-delay:.48s}
}
@keyframes rise{from{transform:translateY(22px)}to{transform:none}}
@keyframes up{from{transform:translateY(14px)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}
@keyframes drift{from{transform:translateX(-10px)}to{transform:translateX(10px)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(480px)}}

/* arkusz z treścią */
.sheet{position:relative;margin-top:-26px;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 14px 0;display:flex;flex-direction:column;gap:14px}
.sheet.flat{margin-top:0;border-radius:0;padding-top:4px}
.phero{padding:14px 18px 10px;display:flex;flex-direction:column;gap:6px}
.phero h1{font-size:2.1rem;font-weight:800;letter-spacing:-.03em}
.phero h1::after{content:"";display:block;width:46px;height:5px;border-radius:9px;background:var(--acc);margin-top:10px}
.phero p{margin:0}
.hbar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.hbar i{display:block;height:100%;background:var(--acc)}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:0 1px 0 var(--line),0 10px 30px -22px rgba(20,26,36,.35)}
.phead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.phead h2{flex:1}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.74rem;font-weight:800;padding:4px 10px;border-radius:99px;background:var(--tint);color:var(--accink)}
.tag svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
.more{font-size:.8rem;font-weight:800;color:var(--accink);text-decoration:none;text-transform:uppercase;letter-spacing:.08em}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tag,:root:not([data-theme="light"]) .more{color:var(--acc)} }
:root[data-theme="dark"] .tag,:root[data-theme="dark"] .more{color:var(--acc)}

/* ostrzeżenia */
.alert{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r);background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 22%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--acc) 45%,transparent);font-size:.92rem}
.alert .aic svg{width:26px;height:26px;stroke:var(--accink);fill:none;stroke-width:2;stroke-linejoin:round}
.alert ul{margin:.3rem 0 0;padding-left:1rem;display:flex;flex-direction:column;gap:4px}

/* trasa */
.strip{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.stn a{display:inline-flex;align-items:center;gap:7px;padding:6px 11px 6px 8px;border-radius:99px;background:var(--bg);text-decoration:none;font-size:.82rem;font-weight:700;line-height:1.2}
.stn i{width:10px;height:10px;border-radius:50%;background:var(--c,var(--acc));flex:none}
.stn.k-hotel i{border-radius:3px}
.hop{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:.72rem;font-weight:700;padding:0 2px}
.hop svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hop.fly{color:var(--accink)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:.6rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:inherit;font-weight:800;font-size:.92rem;cursor:pointer}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary svg{stroke:var(--acc)}
.btn.big{min-height:52px;padding:0 1.6rem}
.btn[disabled]{opacity:.45}
.routes .btnrow .btn.primary{flex:1 1 180px}

/* oś dnia */
.timeline{list-style:none;margin:0;padding:0;position:relative}
.timeline::before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 20%,var(--line)))}
.stop{position:relative;display:grid;grid-template-columns:24px 1fr;gap:12px;padding:2px 0 20px}
.stop:last-child{padding-bottom:0}
.node{width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--c,var(--acc));margin-top:2px;position:relative;z-index:1}
.stop.isdone .node{background:var(--c,var(--acc))}
.gap{position:relative;display:flex;align-items:center;gap:6px;margin:-8px 0 12px 36px;padding:5px 11px;width:max-content;max-width:calc(100% - 36px);border-radius:99px;background:var(--tint);font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.gap b{color:var(--ink);font-variant-numeric:tabular-nums}
.gap svg{width:15px;height:15px;stroke:var(--accink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.srow{display:flex;align-items:flex-start;gap:12px}
.stxt{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.time{font-family:var(--display);font-weight:700;font-size:.86rem;color:var(--accink);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .time{color:var(--acc)} }
:root[data-theme="dark"] .time{color:var(--acc)}
.what{font-weight:800;font-size:1.02rem;line-height:1.3}
.stop.isdone .what{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.cost{display:inline-block;margin-top:4px;font-size:.78rem;font-weight:800;padding:2px 9px;border-radius:99px;background:var(--tint);color:var(--ink);font-variant-numeric:tabular-nums}
.note{margin:.4rem 0 0;font-size:.92rem;color:var(--muted)}
.warn{display:flex;gap:6px;align-items:flex-start;margin:.45rem 0 0;font-size:.88rem;font-weight:700;color:var(--bad)}
.warn svg{width:16px;height:16px;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2.2}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:10px}
.dist{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:700;color:var(--muted)}
.dist svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:.25rem .75rem;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer}
.chip svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip.strong{background:var(--tint);border-color:transparent;color:var(--accink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .chip.strong{color:var(--acc)} }
:root[data-theme="dark"] .chip.strong{color:var(--acc)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tick{position:relative;display:inline-flex;cursor:pointer}
.tick input{position:absolute;inset:-6px;opacity:0;margin:0;cursor:pointer}
.tick .box{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);transition:background .2s,border-color .2s,transform .2s}
.tick .box svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .25s}
.tick.done .box{background:var(--ok);border-color:var(--ok)} .tick.done .box svg{stroke-dashoffset:0}
.tick input:focus-visible + .box{outline:3px solid var(--acc);outline-offset:2px}
.tick:active .box{transform:scale(.9)}

/* kolory typów miejsc */
.k-sight{--c:#2b8cff} .k-food{--c:#f2a12e} .k-transport{--c:#8a93a3} .k-massage{--c:#b26bff} .k-hotel{--c:var(--ink)}

/* jedzenie */
.fscroll{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.fscroll::-webkit-scrollbar{display:none}
.fscroll .fcard{flex:0 0 232px;scroll-snap-align:start}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.fcard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);position:relative;overflow:hidden}
.fgrid .fcard{box-shadow:0 10px 30px -24px rgba(20,26,36,.45)}
.fcard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--acc)}
.fcard.closed{opacity:.62} .fcard.closed::before{background:var(--bad)}
.fcard.been::after{content:"byliśmy";position:absolute;top:12px;right:-30px;transform:rotate(35deg);background:var(--ok);color:#fff;font-size:.62rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 34px}
.ftop{display:flex;align-items:center;gap:8px}
.ftop small{color:var(--muted);font-size:.74rem}
.rbadge{display:inline-flex;align-items:center;gap:4px;font-family:var(--display);font-weight:800;font-size:1rem}
.rbadge svg{width:16px;height:16px;fill:var(--acc);stroke:none}
.fname{font-weight:800;font-size:1.02rem;line-height:1.25;text-decoration:none}
.fbest{margin:0;font-size:.88rem;color:var(--muted);flex:1}
.fmeta{display:flex;flex-wrap:wrap;gap:8px;font-size:.78rem;color:var(--muted);align-items:center}
.fmeta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;vertical-align:-2px;margin-right:3px}
.factions{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.beenl{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--muted)}
.beenl input{width:18px;height:18px;accent-color:var(--ok);margin:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:800}
.pill.bad{background:var(--bad);color:#fff}
.chipsel{display:flex;flex-wrap:wrap;gap:6px}
.chipsel::-webkit-scrollbar{display:none}


/* formularze */
textarea,input,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:.7rem .85rem;min-height:48px}
textarea:focus,input:focus,select:focus{border-color:var(--acc);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 22%,transparent)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.76rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sheet.flat>.field select{background:var(--surface)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;font-weight:700;margin-left:auto}
.toggle input{width:18px;height:18px;min-height:0;accent-color:var(--acc);margin:0}

/* trasa wyjazdu (karty etapów) */
.legs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.leg{position:relative;height:160px;border-radius:18px;overflow:hidden;color:#fff;text-decoration:none;isolation:isolate}
.leg:first-child{grid-column:1/-1}
.leg .scene,.lban .scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.leg::after,.lban::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 25%,rgba(10,14,30,.8))}
.leg.now{box-shadow:0 0 0 3px var(--acc)}
.lov{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:2px}
.lov b{font-family:var(--display);font-size:1.05rem;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.lov small{font-size:.74rem;font-weight:800;color:#fff;opacity:.9;text-transform:uppercase;letter-spacing:.08em}
.lov span{font-size:.82rem;opacity:.9}
.teaser{display:flex;flex-direction:column;gap:2px;text-decoration:none;padding:12px 14px;border-radius:14px;background:var(--tint)}
.teaser b{font-family:var(--display);font-size:.9rem;text-transform:capitalize}
.teaser span{font-size:.9rem;color:var(--muted)}

/* plan */
.lgroup{display:flex;flex-direction:column;gap:8px}
.lban{position:relative;height:120px;border-radius:20px;overflow:hidden;color:#fff;isolation:isolate}
.lban .lov small{color:#fff;text-transform:none;letter-spacing:0;font-weight:600;opacity:.9}
.lban .lov b{font-size:1.3rem;color:#fff}
.days{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ticket{display:grid;grid-template-columns:58px 1fr 40px;gap:12px;align-items:center;padding:12px 14px 12px 0;background:var(--surface);border-radius:16px;text-decoration:none;position:relative;overflow:hidden}
.ticket::after{content:"";position:absolute;left:58px;top:10px;bottom:10px;border-left:2px dashed var(--line)}
.ticket.today{box-shadow:0 0 0 2.5px var(--acc)}
.tdate{display:flex;flex-direction:column;align-items:center}
.tdate b{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1;color:var(--accink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .tdate b{color:var(--acc)} }
:root[data-theme="dark"] .tdate b{color:var(--acc)}
.tdate small{font-size:.7rem;font-weight:800;text-transform:uppercase;color:var(--muted)}
.tbody{display:flex;flex-direction:column;padding-left:4px}
.tbody b{font-weight:800;line-height:1.25}

/* wydatki */

.ring2 .seg{stroke-linecap:butt}
.gtext{display:flex;flex-direction:column}
.gtext small{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.gtext b{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.gtext .pos{color:var(--ok);font-weight:800;font-size:.88rem} .gtext .neg{color:var(--bad);font-weight:800;font-size:.88rem}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:.84rem}
.cats li{display:flex;align-items:center;gap:7px} .cats li span{flex:1;color:var(--muted)} .cats li b{font-variant-numeric:tabular-nums}
.cats i{width:9px;height:9px;border-radius:3px}
.gauge>p{grid-column:1/-1;margin:6px 0 0}
.expform{display:flex;flex-direction:column;gap:12px}
.amt{display:flex;gap:8px}
.amt input{font-family:var(--display);font-size:2rem;font-weight:800;min-height:64px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

.seg2 button{min-width:58px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:800 .9rem var(--display);cursor:pointer}
.seg2 button.on{background:var(--ink);color:var(--bg)}
.eprev{margin:-6px 4px 0;font-weight:800;color:var(--muted);min-height:1.2em;font-variant-numeric:tabular-nums}

/* lista */

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stats div{display:flex;flex-direction:column;align-items:center;padding:12px 4px;border-radius:16px;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.stats b{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--accink)}
.stats small{font-size:.7rem;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}

 main.sw-left{animation:swl .28s cubic-bezier(.2,.7,.2,1)} main.sw-right{animation:swr .28s cubic-bezier(.2,.7,.2,1)} }
@keyframes swl{from{transform:translateX(40px)}to{transform:none}}
@keyframes swr{from{transform:translateX(-40px)}to{transform:none}}

 <a href="#lista"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Lista</a>

<script>
// ===== Tajlandia 2027 – wersja samodzielna (GitHub Pages + Supabase) =====
const RATE_DEFAULT = 0.113;
const GROUND_BUDGET = 5900;
const CATS = [
 {k:"food",n:"Jedzenie",plan:1760},
 {k:"transport",n:"Transport",plan:null},
 {k:"tickets",n:"Atrakcje i wstępy",plan:null},
 {k:"massage",n:"Masaże",plan:null},
 {k:"shop",n:"Zakupy i pamiątki",plan:null},
 {k:"other",n:"Inne",plan:null},
];
// plan (miejsca, dni, lista) jest zaszyfrowany w plan.enc.json i odszyfrowywany kodem wyjazdu
let P={}, FOOD=[], AREAS={}, DAYS=[], TODO=[];
// ===== SCENERIE – jasne, kolorowe ilustracje w stylu plakatu =====
const REGION = {
  bkk:  {n:"Bangkok",       acc:"#f2b233", ink:"#9a6400", tint:"#fbf3e2"},
  hills:{n:"Góry Mae Wang", acc:"#5fbf7f", ink:"#2f7a49", tint:"#eaf5ee"},
  cnx:  {n:"Chiang Mai",    acc:"#f08a3c", ink:"#a5501a", tint:"#fbefe6"},
  cei:  {n:"Chiang Rai",    acc:"#7fb2ff", ink:"#2f63b8", tint:"#ebf2fd"},
  krabi:{n:"Krabi",         acc:"#2fd0c4", ink:"#0d7d76", tint:"#e5f6f4"},
  city: {n:"Bangkok",       acc:"#ff6f91", ink:"#b8325a", tint:"#fdecf1"},
};
const DAY_REGION = {d17:"bkk",d18:"bkk",d19:"bkk",d20:"bkk",d21:"hills",d22:"cnx",d23:"cei",d24:"cnx",d25:"krabi",d26:"krabi",d27:"krabi",d28:"krabi",d29:"city"};
function bkkHour(){ const d=new Date(Date.now()+7*3600e3); return d.getUTCHours()+d.getUTCMinutes()/60; }
function rnd(seed){ let s=0; for(const c of String(seed)) s=(s*31+c.charCodeAt(0))>>>0; return ()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

const SKYC = {bkk:["#38b6ff","#ffe8a8"],hills:["#52c6ff","#e4fbff"],cnx:["#4fb0ff","#ffe1b0"],cei:["#5b9dff","#e8f3ff"],krabi:["#1fb4ff","#c4f5ff"],city:["#ff86a6","#ffd27a"]};
const FLAG = ["#ff4d6d","#ffd23f","#3ad29f","#3fa7ff","#b26bff","#ff8a3d"];

function scene(region, seed, opt){
  opt=opt||{}; const W=400, H=opt.h||260, R=rnd(seed+region), u="s"+Math.floor(R()*1e9).toString(36);
  const sk=SKYC[region]||SKYC.bkk; const base=Math.round(H*0.74);
  let g=`<svg class="scene" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><defs>
   <linearGradient id="${u}k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sk[0]}"/><stop offset="1" stop-color="${sk[1]}"/></linearGradient>
   <linearGradient id="${u}w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${region==="krabi"?"#3fe0d2":"#3cb6d8"}"/><stop offset="1" stop-color="${region==="krabi"?"#0b8fb3":"#1679a6"}"/></linearGradient>
   <linearGradient id="${u}g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffcf4a"/><stop offset=".5" stop-color="#ffe7a0"/><stop offset="1" stop-color="#e9a514"/></linearGradient>
   <linearGradient id="${u}kar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2fbf6a"/><stop offset="1" stop-color="#14864a"/></linearGradient>
   <radialGradient id="${u}s"><stop offset="0" stop-color="#fff7c2"/><stop offset=".45" stop-color="#ffe066" stop-opacity=".85"/><stop offset="1" stop-color="#ffd24d" stop-opacity="0"/></radialGradient></defs>
   <rect width="${W}" height="${H}" fill="url(#${u}k)"/>`;
  // słońce i chmury
  const sx=region==="city"?110:300, sy=H*0.2;
  g+=`<g class="sun"><circle cx="${sx}" cy="${sy}" r="70" fill="url(#${u}s)"/><circle cx="${sx}" cy="${sy}" r="22" fill="#fff2a8"/></g>`;
  g+=`<g class="clouds">${cloud(60,H*0.16,1)}${cloud(220,H*0.1,.7)}${cloud(350,H*0.3,.85)}</g>`;
  const L=(cls,inner)=>`<g class="lay ${cls}">${inner}</g>`;

  if(region==="bkk"){
    g+=L("far",towers(W,base-8,R,["#bcd7f5","#cfe3f7","#e6d2f2","#f6d9c8"],.9,90));
    g+=L("mid",bunting(-10,base-150,410,base-130,16)+prang(120,base,138,52,u,R)+prang(66,base,82,32,u,R)+prang(174,base,82,32,u,R)+temple(300,base,96,120,u)+chedi(386,base,70,36,u));
    g+=water(u,W,H,base,R)+L("fg",lotus(40,base+22)+lotus(360,base+30)+lotus(380,base+18)+longtail(220,base+26,1));
  } else if(region==="city"){
    g+=L("far",towers(W,base,R,["#ffd0dc","#ffe3b0","#c8e6ff","#d9ccff"],1,150));
    g+=L("mid",towers(W,base,R,["#ff8fab","#ffb86b","#6fb7ff","#9b8cff","#43c6a8"],1,110,true)+`<rect x="0" y="${base-40}" width="${W}" height="7" fill="#5d6b8a"/><g class="train"><rect x="30" y="${base-56}" width="120" height="16" rx="5" fill="#fff"/><rect x="30" y="${base-50}" width="120" height="4" fill="#3ad29f"/>${[44,64,84,104,124].map(x=>`<rect x="${x}" y="${base-54}" width="12" height="4" rx="1" fill="#6fb7ff"/>`).join("")}</g>`);
    g+=`<rect x="0" y="${base}" width="${W}" height="${H-base}" fill="#5d6b8a"/><rect x="0" y="${base+16}" width="${W}" height="3" fill="#ffd23f" opacity=".8"/>`;
    g+=L("fg",tuktuk(250,base+34,1.15)+tuktuk(90,base+40,.8,"#ff4d6d")+plane(40,H*0.32));
  } else if(region==="hills"||region==="cnx"||region==="cei"){
    g+=L("far",ridge(W,base-78,36,R,"#8fd6c7",1)+ridge(W,base-40,40,R,"#5cc489",1));
    let mid=ridge(W,base-6,26,R,"#36a86a",1);
    if(region==="hills") mid+=palm(48,base+4,1)+palm(78,base+10,.75)+elephant(250,base+8,1.25,true)+elephant(170,base+12,.8,false)+elephant(330,base+14,.6,false);
    if(region==="cnx") mid+=`<path d="M230 ${base-40} Q300 ${base-110} 390 ${base-40} Z" fill="#2f9a5f"/>`+chedi(305,base-74,74,40,u)+temple(110,base+4,92,118,u)+temple(200,base+4,58,74,u)+bunting(-10,base-118,190,base-104,10);
    if(region==="cei") mid+=whiteTemple(200,base+4)+bunting(-10,base-150,410,base-134,18);
    g+=L("mid",mid);
    g+=`<rect class="mist" x="-40" y="${base-60}" width="${W+80}" height="40" fill="#fff" opacity=".25"/>`;
    g+= region==="cei" ? water(u,W,H,base+6,R)+L("fg",lotus(70,base+28)+lotus(320,base+26)+lotus(350,base+34)) : `<rect x="0" y="${base}" width="${W}" height="${H-base}" fill="#2f9a5f"/>`+L("fg",flowers(W,base,H,R));
  } else if(region==="krabi"){
    g+=L("far",karst(-30,base,100,80,u,R,"#7fd3a4")+karst(40,base,64,46,u,R,"#7fd3a4")+karst(300,base,120,90,u,R,"#7fd3a4")+karst(370,base,80,50,u,R,"#7fd3a4"));
    g+=L("mid",karst(140,base,170,84,u,R)+karst(206,base,110,58,u,R));
    g+=water(u,W,H,base,R);
    g+=`<path d="M${W*0.55} ${H} Q${W*0.8} ${base+18} ${W+10} ${base+12} L${W+10} ${H}Z" fill="#ffe2a6"/>`;
    g+=L("fg",palm(360,base+26,1.2,true)+palm(388,base+30,.85,true)+longtail(110,base+30,1.35));
  }
  return g+`</svg>`;
}

const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function decryptPlan(c){
  const enc = await (await fetch("plan.enc.json",{cache:"no-cache"})).json();
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(c), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(enc.salt),iterations:enc.iter,hash:"SHA-256"}, base, {name:"AES-GCM",length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(enc.iv)}, key, b64(enc.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function dParts(iso){ const [y,m,d]=iso.split("-").map(Number); const dt=new Date(Date.UTC(y,m-1,d)); return {d,m:m-1,wd:dt.getUTCDay()}; }
function dLabel(iso,long){ const p=dParts(iso); return (long?WDL[p.wd]:WD[p.wd])+" "+p.d+" "+MON[p.m]; }
function currentDay(){ const t=bkkToday(); return DAYS.find(d=>d.date===t) || (t<DAYS[0].date?DAYS[0]:t>DAYS[DAYS.length-1].date?DAYS[DAYS.length-1]:DAYS[0]); }
function daysToGo(){ const t=bkkToday(); const a=Date.parse(t), b=Date.parse(DAYS[0].date); return Math.round((b-a)/864e5); }

// ---------- linki do Map Google ----------
function placeUrl(p){ return "https://www.google.com/maps/search/?api=1&query="+enc(p.q||p.n)+(p.id?"&query_place_id="+p.id:""); }
function ptParam(p){ return p.id ? enc(p.q||p.n) : (p.lat+","+p.lng); }
function dirUrl(pts,mode){
  let u="https://www.google.com/maps/dir/?api=1&travelmode="+(mode||"walking");
  if(pts.length===1){ const p=pts[0]; return u+"&destination="+ptParam(p)+(p.id?"&destination_place_id="+p.id:""); }
  const o=pts[0], d=pts[pts.length-1], w=pts.slice(1,-1);
  u+="&origin="+ptParam(o)+(o.id?"&origin_place_id="+o.id:"")+"&destination="+ptParam(d)+(d.id?"&destination_place_id="+d.id:"");
  if(w.length){ u+="&waypoints="+w.map(ptParam).join("%7C"); if(w.every(x=>x.id)) u+="&waypoint_place_ids="+w.map(x=>x.id).join("%7C"); }
  return u;
}
function routeChunks(pts){ // telefon przyjmuje start + 3 przystanki + cel
  const out=[]; let i=0; if(pts.length<2) return out;
  while(i<pts.length-1){ const seg=pts.slice(i,i+5); out.push(seg); i+=seg.length-1; }
  return out;
}
function daySegments(day){ // trasa dzielona na odcinki przy lotach
  const segs=[[]]; if(day.start) segs[0].push(P[day.start]);
  day.s.forEach(s=>{ if(s.brk && segs[segs.length-1].length) segs.push([]); if(s.p){ const p=P[s.p], cur=segs[segs.length-1]; if(p && cur[cur.length-1]!==p) cur.push(p); } });
  return segs.filter(g=>g.length);
}
function dayPoints(day){ const seq=[]; daySegments(day).flat().forEach(p=>{ if(!seq.includes(p)) seq.push(p); }); return seq; }
const MODE_PL={walking:"pieszo",driving:"autem",transit:"komunikacją"};
const WALK_KM=1.2; // do tylu km w linii prostej idziemy pieszo
function legMode(a,b,day,st){ if(st&&st.m) return st.m; return km(a,b)<=WALK_KM ? "walking" : day.mode; }
function dayLegsRuns(day){ // odcinki o jednym trybie, gotowe do linków
  const runs=[]; let prev=day.start?P[day.start]:null;
  day.s.forEach(st=>{ if(st.brk) prev=null; if(!st.p) return; const p=P[st.p]; if(!p) return;
    if(prev && prev!==p){ const m=legMode(prev,p,day,st); const last=runs[runs.length-1];
      if(last && last.mode===m && last.pts[last.pts.length-1]===prev) last.pts.push(p); else runs.push({mode:m,pts:[prev,p]}); }
    prev=p; });
  return runs.flatMap(r=>routeChunks(r.pts).map(c=>({mode:r.mode,pts:c})));
}
function km(a,b){ const R=6371,toR=x=>x*Math.PI/180; const dLa=toR(b.lat-a.lat), dLo=toR(b.lng-a.lng);
  const h=Math.sin(dLa/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
const fmtKm = k => k<0.995 ? Math.round(k*1000/10)*10+" m" : k.toFixed(k<10?1:0).replace(".",",")+" km";
const fmtZl = v => Math.round(v).toLocaleString("pl-PL")+" zł";
const fmtTHB = v => Math.round(v).toLocaleString("pl-PL")+" THB";

function bkkClock(){ const h=bkkHour(); const hh=Math.floor(h), mm=Math.round((h-hh)*60); return hh+":"+String(mm%60).padStart(2,"0"); }

function dayProgress(day){ let n=0,d=0; day.s.forEach((s,i)=>{ n++; const t=S.ticks[day.id+"_"+i]; if(t&&t.done) d++; }); return [d,n]; }
function regionOf(day){ return DAY_REGION[day.id]||"bkk"; }

function routeStrip(day){
  const segs=daySegments(day); const chunks=day.noroute?[]:dayLegsRuns(day);
  let strip=`<ol class="strip">`;
  segs.forEach((g,si)=>{ if(si) strip+=`<li class="hop fly">${ICON.plane}<span>lot</span></li>`;
    g.forEach((p,i)=>{ if(i){ const m=legMode(g[i-1],p,day); strip+=`<li class="hop">${MODE_IC[m]}<span>${fmtKm(km(g[i-1],p))}</span></li>`; }
      strip+=`<li class="stn k-${p.t}"><a href="${placeUrl(p)}" target="_blank" rel="noopener"><i></i><span>${esc(short(p))}</span></a></li>`; }); });
  strip+=`</ol>`;
  return `<section class="panel routes"><div class="phead"><h2>Trasa dnia</h2></div>
   ${strip}
   ${day.noroute?`<p class="muted small">Ten dzień płyniecie łodzią z wycieczką, więc trasy nie ma.</p>`:
   `<div class="btnrow">${chunks.map((c,i)=>`<a class="btn primary" href="${dirUrl(c.pts,c.mode)}" target="_blank" rel="noopener">${MODE_IC[c.mode]}${chunks.length>1?`Część ${i+1} · `:"Otwórz trasę · "}${MODE_PL[c.mode]}, ${c.pts.length} pkt</a>`).join("")}</div>`}
   </section>`;
}

function renderDay(day,fromToday){
  const warns=day.s.filter(s=>s.w);
  let h=heroDay(day,fromToday);
  h+=`<div class="sheet">`;
  if(warns.length) h+=`<section class="alert"><div class="aic">${ICON.warn}</div><div><strong>Do sprawdzenia</strong><ul>${warns.map(s=>`<li><b>${esc(s.x)}.</b> ${esc(s.w)}</li>`).join("")}</ul></div></section>`;
  h+=routeStrip(day);
  h+=`<section class="panel"><div class="phead"><h2>Po kolei</h2></div><ol class="timeline">`;
  let prev=day.start?P[day.start]:null;
  day.s.forEach((s,i)=>{
    const id=day.id+"_"+i, pl=s.p?P[s.p]:null, done=S.ticks[id]&&S.ticks[id].done;
    if(s.brk) prev=null;
    const leg="";
    const lm = pl&&prev&&prev!==pl ? legMode(prev,pl,day,s) : day.mode;
    if(pl && prev && prev!==pl){ const d=km(prev,pl); h+=`<li class="gap" aria-label="Odległość ${fmtKm(d)}">${MODE_IC[lm]}<b>${fmtKm(d)}</b><span>${eta(d,lm)}</span></li>`; }
    h+=`<li class="stop k-${pl?pl.t:"none"}${done?" isdone":""}${s.w?" haswarn":""}">
      <div class="node" aria-hidden="true"></div>
      <div class="sbody">
        <div class="srow"><div class="stxt">${s.t?`<span class="time">${esc(s.t)}</span>`:""}<div class="what">${esc(s.x)}</div></div>${tickBox(id,s.x)}</div>
        ${s.c?`<div class="cost">${esc(s.c)} zł</div>`:""}
        ${s.n?`<p class="note">${esc(s.n)}</p>`:""}
        ${s.w?`<p class="warn">${ICON.warn}${esc(s.w)}</p>`:""}
        ${pl?`<div class="chips"><a class="chip strong" href="${dirUrl([pl],lm)}" target="_blank" rel="noopener">${ICON.nav}Prowadź</a>${leg}</div>`:""}
      </div></li>`;
    if(pl) prev=pl;
  });
  h+=`</ol></section>`;
  const wdd=dParts(day.date).wd; const food=FOOD.filter(f=>day.areas.includes(f.a)&&!f.closed.includes(wdd)).sort((a,b)=>b.r-a.r).slice(0,8);

  const note=S.notes[day.id];
  h+=`<section class="panel"><div class="phead"><h2>Notatki dnia</h2></div><textarea id="note-${day.id}" data-note="${day.id}" rows="4" placeholder="Np. nr lotu, cena u kierowcy, co się udało…">${esc(note?note.text:"")}</textarea>
    <p class="muted small">${note&&note.at?`Zapisano ${timeAgo(note.at)}${note.by?" · "+esc(who(note.by)):""}`:"Zapisuje się samo. Widzicie je oboje."}</p></section>`;
  const idx=DAYS.indexOf(day);
  return h+`</div>`;
}
function eta(d,mode){ const r=d*1.3; const v= mode==="walking"?4.5 : mode==="transit"?18 : (22+Math.min(r,80)/80*43); let m=Math.round(r/v*60);
  if(mode==="walking"&&r>2.5) return "lepiej Grabem, ok. "+fmtMin(Math.round(r/22*60+5));
  return "ok. "+fmtMin(Math.max(m,2))+(mode==="walking"?" pieszo":mode==="transit"?" komunikacją":" autem"); }
function fmtMin(m){ if(m<60) return m+" min"; const h=Math.floor(m/60), r=Math.round((m%60)/5)*5; return h+" h"+(r?" "+r+" min":""); }
function dayPicker(sel){ const t=bkkToday();
  return `<nav class="dpick" aria-label="Wybierz dzień">${DAYS.map(d=>{ const p=dParts(d.date); const [dn,tn]=dayProgress(d);
    return `<a href="#${d.id}" class="${d===sel?"on":""}${d.date===t?" today":""}${dn===tn&&tn?" full":""}" style="--acc:${REGION[regionOf(d)].acc}" aria-current="${d===sel?"page":"false"}"><small>${WD[p.wd]}</small><b>${p.d}</b></a>`; }).join("")}</nav>`; }
function short(p){ return p.n.replace(/ \(.*\)$/,"").replace(/ –.*$/,"").split(" i ")[0]; }
function timeAgo(t){ const m=Math.round((Date.now()-t)/6e4); if(m<1) return "przed chwilą"; if(m<60) return m+" min temu"; const h=Math.round(m/60); if(h<24) return h+" godz. temu"; return new Date(t).toLocaleDateString("pl-PL"); }

function foodCard(f,day){
  const wd = day? dParts(day.date).wd : null; const closed = wd!=null && f.closed.includes(wd);

    <div class="ftop"><span class="rbadge">${ICON.star}${f.r.toFixed(1).replace(".",",")}</span><small>${f.c.toLocaleString("pl-PL")} opinii</small></div>

  </article>`;
}

  return `<header class="phero" style="--acc:${REGION[rg].acc}"><h1>Jedzenie</h1><p class="muted">Tanie, lokalne miejsca przy trasie. Oceny z Google Maps (listopad 2026).</p></header>
   <div class="sheet flat">
   <div class="field"><label for="fday">Na który dzień? Pokażę tylko otwarte</label><select id="fday">${DAYS.map(d=>`<option value="${d.id}" ${d===day?"selected":""}>${dLabel(d.date)} – ${esc(d.title)}</option>`).join("")}</select></div>
   <div class="chipsel">${Object.entries(AREAS).map(([k,v])=>`<button class="chip${k===area?" on":""}" data-area="${k}">${esc(v.replace("Bangkok – ","BKK · "))}</button>`).join("")}</div>
   <div class="fgrid">${list.map(f=>foodCard(f,day)).join("")}</div>
   <p class="muted small">${hidden?`Ukryłem ${hidden} ${hidden===1?"miejsce zamknięte":"miejsca zamknięte"} ${["w niedzielę","w poniedziałek","we wtorek","w środę","w czwartek","w piątek","w sobotę"][wdf]}. `:""}Większość miejsc przyjmuje tylko gotówkę.</p></div>`;
}

function renderMap(){
  const day = DAYS.find(d=>d.id===mapDay) || currentDay(); mapDay=day.id;
  const rg=regionOf(day), R=REGION[rg], hotel=P[day.hotel];
  const stops=dayPoints(day);
  const pins=stops.map((p,i)=>({p,num:i+1,kind:p.t}));
  if(!stops.includes(hotel)) pins.push({p:hotel,num:"H",kind:"hotel"});
  const foods = showFoodOnMap ? FOOD.filter(f=>day.areas.includes(f.a)&&!f.closed.includes(dParts(day.date).wd)) : [];
  const all=[...pins.map(x=>x.p),...foods];
  let mnLa=Infinity,mxLa=-Infinity,mnLo=Infinity,mxLo=-Infinity;
  all.forEach(p=>{mnLa=Math.min(mnLa,p.lat);mxLa=Math.max(mxLa,p.lat);mnLo=Math.min(mnLo,p.lng);mxLo=Math.max(mxLo,p.lng);});
  const cos=Math.cos((mnLa+mxLa)/2*Math.PI/180);
  let w=(mxLo-mnLo)*cos, hh=(mxLa-mnLa); if(w<0.004) w=0.004; if(hh<0.004) hh=0.004;
  const W=360,H=Math.round(Math.max(300,Math.min(480,360*hh/w))),pad=34;
  const sc=Math.min((W-2*pad)/w,(H-2*pad)/hh);
  const cLo=(mnLo+mxLo)/2, cLa=(mnLa+mxLa)/2;
  const X=p=>W/2+(p.lng-cLo)*cos*sc, Y=p=>H/2-(p.lat-cLa)*sc;
  const kmPerPx = 111.32/sc; const nice=[0.1,0.2,0.5,1,2,5,10,20,50,100]; const target=W*0.22*kmPerPx; const sb=nice.find(n=>n>=target)||100; const sbPx=sb/kmPerPx;
  let svg=`<svg viewBox="0 0 ${W} ${H}" class="map" role="img" aria-label="Układ miejsc: ${esc(dLabel(day.date))}"><defs><radialGradient id="mglow" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="${R.acc}" stop-opacity=".22"/><stop offset="1" stop-color="${R.acc}" stop-opacity="0"/></radialGradient>
   <pattern id="mdots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" class="mdot"/></pattern></defs>
   <rect width="${W}" height="${H}" class="mbg"/><rect width="${W}" height="${H}" fill="url(#mdots)"/><rect width="${W}" height="${H}" fill="url(#mglow)"/>`;
  // okręgi odległości od hotelu
  [1,2,5,10,25,50,100].forEach(r=>{ const rp=r/kmPerPx; if(rp>30&&rp<W) svg+=`<circle cx="${X(hotel).toFixed(1)}" cy="${Y(hotel).toFixed(1)}" r="${rp.toFixed(1)}" class="mring"/><text x="${(X(hotel)+rp*.707+3).toFixed(1)}" y="${(Y(hotel)-rp*.707).toFixed(1)}" class="mringt">${r} km</text>`; });
  if(!day.noroute) daySegments(day).forEach(g=>{ if(g.length>1){ const pts=g.map(p=>X(p).toFixed(1)+","+Y(p).toFixed(1)).join(" "); svg+=`<polyline class="mroute-glow" points="${pts}" style="stroke:${R.acc}"/><polyline class="mroute" points="${pts}" style="stroke:${R.acc}"/>`; } });
  foods.forEach(f=>{ svg+=`<circle class="mfood" cx="${X(f).toFixed(1)}" cy="${Y(f).toFixed(1)}" r="5" data-pin="f:${f.k}"><title>${esc(f.n)}</title></circle>`; });
  pins.forEach(x=>{ const cx=+X(x.p).toFixed(1), cy=+Y(x.p).toFixed(1);
    if(x.num==="H") svg+=`<g data-pin="p:${keyOf(x.p)}" class="mg"><rect class="mhotel" x="${cx-11}" y="${cy-11}" width="22" height="22" rx="6"/><text x="${cx}" y="${cy+4}" class="mlabel dark">H</text></g>`;
    else svg+=`<g data-pin="p:${keyOf(x.p)}" class="mg"><circle cx="${cx}" cy="${cy}" r="16" class="mhalo k-${x.kind}"/><circle class="mpin k-${x.kind}" cx="${cx}" cy="${cy}" r="11"/><text x="${cx}" y="${cy+4}" class="mlabel">${x.num}</text></g>`; });
  svg+=`<g class="scale"><line x1="${pad}" y1="${H-16}" x2="${(pad+sbPx).toFixed(1)}" y2="${H-16}"/><text x="${pad}" y="${H-23}">${String(sb).replace(".",",")} km</text></g><g class="north"><path d="M${W-26} ${pad-6} l6 16 l-6 -4 l-6 4z"/><text x="${W-26}" y="${pad+24}">N</text></g></svg>`;
  const rows=pins.map(x=>`<li id="pin-p-${keyOf(x.p)}"><span class="mk k-${x.kind}">${x.num}</span><span class="nm">${esc(x.p.n)}<small>${x.p===hotel?"nocleg":fmtKm(km(hotel,x.p))+" od hotelu"}</small></span><a class="chip strong" href="${dirUrl([x.p],day.mode)}" target="_blank" rel="noopener">${ICON.nav}</a><a class="chip" href="${placeUrl(x.p)}" target="_blank" rel="noopener">${ICON.img}</a></li>`).join("");
  const frows=foods.sort((a,b)=>km(hotel,a)-km(hotel,b)).map(f=>`<li id="pin-f-${f.k}"><span class="mk k-food sm"></span><span class="nm">${esc(f.n)}<small>${ICON.star}${f.r.toFixed(1).replace(".",",")} · ${fmtKm(km(hotel,f))} od hotelu</small></span><a class="chip strong" href="${dirUrl([f],"walking")}" target="_blank" rel="noopener">${ICON.nav}</a><a class="chip" href="${placeUrl(f)}" target="_blank" rel="noopener">${ICON.img}</a></li>`).join("");
  return `<header class="phero" style="--acc:${R.acc}"><h1>Mapa dnia</h1><p class="muted">Pinezki względem hotelu, okręgi co kilka km. Ulice i nawigacja otwierają się w Mapach Google.</p></header>
   <div class="sheet flat">
   <div class="field"><label for="mday">Dzień</label><select id="mday">${DAYS.map(d=>`<option value="${d.id}" ${d===day?"selected":""}>${dLabel(d.date)} – ${esc(d.title)}</option>`).join("")}</select></div>
   <div class="mapwrap" style="--acc:${R.acc}">${svg}
     <div class="legend"><span><i class="mk k-sight sm"></i>atrakcja</span><span><i class="mk k-food sm"></i>jedzenie</span><span><i class="mk k-transport sm"></i>transport</span><span><i class="mk k-massage sm"></i>masaż</span><span><i class="mk k-hotel sm sq"></i>hotel</span>
     <label class="toggle"><input type="checkbox" id="mfood" ${showFoodOnMap?"checked":""}><span>knajpki</span></label></div></div>
   <section class="panel"><div class="phead"><h2>Kolejność dnia</h2></div><ul class="pins">${rows}</ul></section>
   ${foods.length?`<section class="panel"><div class="phead"><h2>Knajpki od najbliższej</h2></div><ul class="pins">${frows}</ul></section>`:""}</div>`;
}
function keyOf(p){ for(const k in P) if(P[k]===p) return k; return "x"; }

let expDraft = LS.get("expDraft",{cur:"THB",cat:"food"});
function toZl(e){ return e.cur==="PLN"?e.amt:e.amt*S.rate; }
const CAT_COL={food:"#f2b233",transport:"#7fb2ff",tickets:"#2fd0c4",massage:"#c38bff",shop:"#ff6f91",other:"#9aa9a4"};
function renderExp(){
  const list=Object.entries(S.exp).map(([id,e])=>({id,...e})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.at||0)-(a.at||0));
  const total=list.reduce((s,e)=>s+toZl(e),0);
  const byCat={}; list.forEach(e=>{ byCat[e.cat]=(byCat[e.cat]||0)+toZl(e); });
  const dDone = DAYS.filter(d=>d.date<=bkkToday()).length;
  const pct=Math.min(1,total/GROUND_BUDGET);
  const tday=currentDay().date;
  // pierścień: segmenty kategorii
  let off=0; const C=2*Math.PI*52; let segs="";
  CATS.forEach(c=>{ const v=byCat[c.k]||0; if(!v) return; const L=Math.min(v/GROUND_BUDGET,1-off)*C; if(L<=0) return; segs+=`<circle cx="70" cy="70" r="52" class="seg" style="stroke:${CAT_COL[c.k]}" stroke-dasharray="${L.toFixed(1)} ${C.toFixed(1)}" stroke-dashoffset="${(-off*C).toFixed(1)}"/>`; off+=v/GROUND_BUDGET; });
  let h=`<header class="phero"><h1>Wydatki</h1><p class="muted">Wszystko, co płacicie na miejscu. Plan zakłada ok. ${fmtZl(GROUND_BUDGET)}.</p></header><div class="sheet flat">
  <section class="panel gauge"><svg viewBox="0 0 140 140" class="ring2" aria-hidden="true"><circle cx="70" cy="70" r="52" class="track"/>${segs}</svg>
    <div class="gtext"><small>wydane</small><b>${fmtZl(total)}</b><span class="${total>GROUND_BUDGET?"neg":"pos"}">${total>GROUND_BUDGET?"ponad plan o "+fmtZl(total-GROUND_BUDGET):"zostało "+fmtZl(GROUND_BUDGET-total)}</span></div>
    <ul class="cats">${CATS.map(c=>`<li><i style="background:${CAT_COL[c.k]}"></i><span>${c.n}</span><b>${fmtZl(byCat[c.k]||0)}</b></li>`).join("")}</ul>
    <p class="muted small">${dDone?`Dzień ${dDone} z ${DAYS.length}: średnio ${fmtZl(total/dDone)} dziennie, plan ok. ${fmtZl(GROUND_BUDGET/DAYS.length)}.`:`Liczy się od 17.01. Plan to ok. ${fmtZl(GROUND_BUDGET/DAYS.length)} dziennie, w tym jedzenie ok. 135 zł.`}</p></section>
  <section class="panel"><div class="phead"><h2>Dodaj wydatek</h2></div>
   <form id="expform" class="expform" autocomplete="off">
    <div class="amt"><input id="e-amt" inputmode="decimal" placeholder="0" aria-label="Kwota" required>
     <div class="seg2" role="radiogroup" aria-label="Waluta">${["THB","PLN"].map(c=>`<button type="button" data-cur="${c}" class="${expDraft.cur===c?"on":""}">${c==="PLN"?"zł":"THB"}</button>`).join("")}</div></div>
    <p id="e-prev" class="eprev"></p>
    <div class="catsel">${CATS.map(c=>`<button type="button" data-cat="${c.k}" class="chip${expDraft.cat===c.k?" on":""}" style="--cc:${CAT_COL[c.k]}"><i></i>${c.n}</button>`).join("")}</div>
    <input id="e-desc" placeholder="Na co? np. Grab do hotelu" aria-label="Opis">
    <div class="twocol"><div class="field"><label for="e-date">Dzień</label><select id="e-date">${DAYS.map(d=>`<option value="${d.date}" ${d.date===tday?"selected":""}>${dLabel(d.date)}</option>`).join("")}</select></div>
    <button class="btn primary big" type="submit" ${S.readOnly?"disabled":""}>Zapisz</button></div>
   </form></section>`;
  const groups={}; list.forEach(e=>{ (groups[e.date]=groups[e.date]||[]).push(e); });
  h+=`<section class="panel"><div class="phead"><h2>Historia</h2><span class="tag">${list.length}</span></div>`;
  if(!list.length) h+=`<p class="muted">Jeszcze pusto. Pierwszy wydatek pojawi się tutaj i u drugiej osoby.</p>`;
  Object.keys(groups).sort().reverse().forEach(d=>{ const g=groups[d]; const sum=g.reduce((s,e)=>s+toZl(e),0);
    h+=`<h3 class="gday">${dLabel(d,true)}<span>${fmtZl(sum)}</span></h3><ul class="exps">${g.map(e=>{ const cat=CATS.find(c=>c.k===e.cat)||CATS[5];
      return `<li><i class="cdot" style="background:${CAT_COL[cat.k]}"></i><div><b>${esc(e.desc||cat.n)}</b><small>${esc(cat.n)}${e.by?" · "+esc(who(e.by)):""}</small></div>
      <div class="amtc"><b>${e.cur==="PLN"?fmtZl(e.amt):fmtTHB(e.amt)}</b>${e.cur==="THB"?`<small>${fmtZl(toZl(e))}</small>`:""}</div>
      <button class="del" data-del="${e.id}" aria-label="Usuń wydatek">✕</button></li>`; }).join("")}</ul>`; });
  h+=`</section>
  <section class="panel"><div class="phead"><h2>Kurs</h2></div><div class="twocol"><div class="field"><label for="rate">1 THB = ? zł</label><input id="rate" inputmode="decimal" value="${String(S.rate).replace(".",",")}"></div><button class="btn" id="saverate" type="button">Zapisz kurs</button></div>
  <p class="muted small">Kurs jest wspólny dla was obojga.</p></section></div>`;
  return h;
}

function renderTodo(){
  const all=TODO.flatMap(g=>g.items); const done=all.filter(t=>{ const s=S.ticks[t.id]; return s?s.done:!!t.d; }).length;
  let h=`<header class="phero"><h1>Do załatwienia</h1><p class="muted">${done} z ${all.length} gotowe</p><div class="hbar"><i style="width:${Math.round(done/all.length*100)}%"></i></div></header><div class="sheet flat">`;
  TODO.forEach(g=>{ h+=`<section class="panel"><div class="phead"><h2>${esc(g.g)}</h2></div><ul class="todo">${g.items.map(t=>{ const s=S.ticks[t.id]; const d=s?s.done:!!t.d;
    return `<li class="${d?"isdone":""}">${tickBox(t.id,t.x,t.d)}<span>${esc(t.x)}${s&&s.by&&s.done?`<small>${esc(who(s.by))}</small>`:""}</span></li>`; }).join("")}</ul></section>`; });
  const note=S.notes.general;
  h+=`<section class="panel"><div class="phead"><h2>Notatki ogólne</h2></div><textarea data-note="general" id="note-general" rows="5" placeholder="Numery rezerwacji, telefony do hoteli…">${esc(note?note.text:"")}</textarea>
  <p class="muted small">${note&&note.at?`Zapisano ${timeAgo(note.at)}${note.by?" · "+esc(who(note.by)):""}`:"Widzicie je oboje."}</p></section>
  <p class="muted small center">Na tym telefonie: <b>${esc(S.me||"")}</b> · <a href="#" id="logout">wyloguj</a></p></div>`;
  return h;
}

// ---------- render ----------
let lastFocus=null;
function render(){
  if(!DAYS.length) return;
  const main=$("#main"); if(!main) return;
  // nie przerywaj pisania
  const a=document.activeElement;
  if(a && (a.tagName==="TEXTAREA" || (a.tagName==="INPUT" && a.type!=="checkbox") || a.tagName==="SELECT") && main.contains(a)){ pendingRender=true; return; }
  let html="";
  if(view==="dzis") html=renderToday();
  else if(view==="plan") html=renderPlan();
  else if(view==="mapa") html=renderMap();
  else if(view==="jedzenie") html=renderFood();
  else if(view==="wydatki") html=renderExp();
  else if(view==="lista") html=renderTodo();
  else { const d=DAYS.find(x=>x.id===view); html=d?renderDay(d):renderToday(); }
  const openF=[...main.querySelectorAll("details[open]")].map(d=>d.id);
  main.innerHTML=html;
  openF.forEach(id=>{ const d=document.getElementById(id); if(d) d.open=true; });
  if(swipeDir){ main.classList.remove("sw-left","sw-right"); void main.offsetWidth; main.classList.add("sw-"+swipeDir); swipeDir=null; }
  const dv = /^d\d\d$/.test(view) ? DAYS.find(x=>x.id===view) : view==="mapa"&&mapDay ? DAYS.find(x=>x.id===mapDay) : currentDay();
  const rg = REGION[view==="dzis"&&daysToGo()>0?"bkk":regionOf(dv)]; const rs=document.documentElement.style; rs.setProperty("--acc",rg.acc); rs.setProperty("--accink",rg.ink); rs.setProperty("--tint-light",rg.tint);
  document.body.classList.toggle("hashero", view==="dzis" || /^d\d\d$/.test(view));
  document.querySelectorAll(".tabs a").forEach(t=>{ const v=t.getAttribute("href").slice(1); t.classList.toggle("on", v===view || (v==="plan" && /^d\d\d$/.test(view))); t.setAttribute("aria-current", t.classList.contains("on")?"page":"false"); });
  setSync(S.sync);
  updateExpPreview();
}
let pendingRender=false;
document.addEventListener("focusout",()=>{ setTimeout(()=>{ if(pendingRender){ pendingRender=false; render(); } },50); });

// ---------- zdarzenia ----------
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.tick){ const id=t.dataset.tick; write("ticks/"+id,{done:t.checked,by:S.me||"",at:Date.now()}); return; }
  if(t.id==="mday"){ mapDay=t.value; t.blur(); render(); }
  if(t.id==="mfood"){ showFoodOnMap=t.checked; render(); }
  if(t.id==="fday"){ foodDay=t.value; foodArea=DAYS.find(d=>d.id===t.value).areas[0]; t.blur(); render(); }
});
document.addEventListener("click",e=>{
  if(e.target.id==="logout"){ e.preventDefault(); logout(); return; }
  const t=e.target.closest("[data-area],[data-cur],[data-cat],[data-del],[data-mapday],[data-foodday],[data-pin],#saverate");
  if(!t) return;
  if(t.dataset.area){ foodArea=t.dataset.area; render(); }
  else if(t.dataset.cur){ expDraft.cur=t.dataset.cur; LS.set("expDraft",expDraft); document.querySelectorAll("[data-cur]").forEach(b=>b.classList.toggle("on",b===t)); updateExpPreview(); }
  else if(t.dataset.cat){ expDraft.cat=t.dataset.cat; LS.set("expDraft",expDraft); document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("on",b===t)); }
  else if(t.dataset.del){ if(t.classList.contains("confirm")){ write("expenses/"+t.dataset.del,null); } else { t.classList.add("confirm"); t.textContent="Usuń?"; setTimeout(()=>{ if(t.isConnected){ t.classList.remove("confirm"); t.textContent="✕"; } },3000); } }
  else if(t.dataset.mapday){ mapDay=t.dataset.mapday; }
  else if(t.dataset.foodday){ foodDay=t.dataset.foodday; foodArea=null; }
  else if(t.dataset.pin){ const [k,id]=t.dataset.pin.split(":"); const row=document.getElementById("pin-"+k+"-"+id); if(row){ row.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"center"}); row.classList.add("flash"); setTimeout(()=>row.classList.remove("flash"),1600);} }
  else if(t.id==="saverate"){ const v=parseFloat(($("#rate").value||"").replace(",",".")); if(v>0.01&&v<1){ write("settings/main",{rate:v,by:S.me||"",at:Date.now()}); S.rate=v; persist(); toast("Kurs zapisany"); } else toast("Wpisz kurs, np. 0,113"); }
});
let noteTimers={};
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.note){ const id=t.dataset.note; clearTimeout(noteTimers[id]); noteTimers[id]=setTimeout(()=>saveNote(id,t.value),1500); }
  if(t.id==="e-amt") updateExpPreview();
});
document.addEventListener("focusout",e=>{ const t=e.target; if(t.dataset && t.dataset.note){ clearTimeout(noteTimers[t.dataset.note]); saveNote(t.dataset.note,t.value); } });
function saveNote(id,text){ const cur=S.notes[id]; if(cur && cur.text===text) return; if(!cur && !text) return; write("notes/"+id,{text,by:S.me||"",at:Date.now()}); }
document.addEventListener("submit",e=>{
  if(e.target.id!=="expform") return; e.preventDefault();
  const amt=parseFloat(($("#e-amt").value||"").replace(",",".").replace(/\s/g,""));
  if(!(amt>0)){ toast("Wpisz kwotę"); return; }
  const id="e"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  write("expenses/"+id,{amt,cur:expDraft.cur,cat:expDraft.cat,desc:($("#e-desc").value||"").trim().slice(0,120),date:$("#e-date").value,by:S.me||"",at:Date.now()});
  toast("Zapisano wydatek");
});
function updateExpPreview(){ const el=$("#e-prev"), inp=$("#e-amt"); if(!el||!inp) return; const v=parseFloat((inp.value||"").replace(",",".")); el.textContent = v>0 ? (expDraft.cur==="THB"?`= ${fmtZl(v*S.rate)}`:`= ${fmtTHB(v/S.rate)}`) : ""; }
let toastT; function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),2200); }

// przesuwanie palcem między dniami
let tx=null, ty=null, tt=0;
document.addEventListener("touchstart",e=>{ const t=e.touches[0]; if(e.touches.length!==1 || e.target.closest("input,textarea,select,.fgrid")){ tx=null; return; } tx=t.clientX; ty=t.clientY; tt=Date.now(); },{passive:true});
document.addEventListener("touchend",e=>{ if(tx===null) return; const t=e.changedTouches[0], dx=t.clientX-tx, dy=t.clientY-ty; tx=null;
  if(Math.abs(dx)<70 || Math.abs(dy)>Math.abs(dx)*0.6 || Date.now()-tt>800) return;
  const cur = /^d\d\d$/.test(view) ? DAYS.find(d=>d.id===view) : (view==="dzis" && !(LANDING>Date.now() && bkkToday()<DAYS[0].date)) ? currentDay() : null;
  if(!cur) return; const i=DAYS.indexOf(cur)+(dx<0?1:-1); if(i<0||i>=DAYS.length) return;
  swipeDir = dx<0 ? "left" : "right"; location.hash="#"+DAYS[i].id; },{passive:true});
let swipeDir=null;
boot();
})();

</script>
